name: Build Keno Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Prepare Gradle
    run: |
      curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
      unzip -q /tmp/gradle.zip -d /tmp
      echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

  - name: Check project files
    run: |
      echo "Repository files:"
      ls -la
      if [ ! -f settings.gradle.kts ]; then
        echo "Android project files are not uploaded yet."
        exit 1
      fi

  - name: Build debug APK
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KenoReader-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
