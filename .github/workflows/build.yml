
name: Build Keno Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q KenoScreenReader-starter.zip -d project
          find project -name settings.gradle.kts -print

      - name: Find project folder
        id: project
        run: |
          FILE="$(find project -name settings.gradle.kts -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP"
            find project -maxdepth 5 -type f
            exit 1
          fi
          DIR="$(dirname "$FILE")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set Java and Kotlin targets to 17
        working-directory: project
        run: |
          FILE="$(find . -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found inside ZIP"
            find . -maxdepth 6 -type f
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "dependencies {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {""",
                  1
              )
          else:
              if "sourceCompatibility" not in s:
                  s = s.replace(
                      "compileOptions {",
                      'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17',
                      1
                  )
              if "jvmTarget" not in s:
                  s = s.replace(
                      "dependencies {",
                      'android {\n    kotlinOptions { jvmTarget = "17" }\n}\n\ndependencies {',
                      1
                  )

          p.write_text(s)
          print("Updated:", p)
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KenoReader-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
