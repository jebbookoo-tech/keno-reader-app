
name: Build Keno Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and install packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check ZIP file
        run: |
          if [ ! -f KenoScreenReader-starter.zip ]; then
            echo "ERROR: KenoScreenReader-starter.zip not found"
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q KenoScreenReader-starter.zip -d project
          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts not found after extraction"
            find project -maxdepth 4 -type f
            exit 1
          fi

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KenoReader-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
